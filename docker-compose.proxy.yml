# Overlay VOLUNTARIO para el servidor de producción: agrega el proxy TLS.
# No altera el stack local (localhost:8000 sigue respondiendo directo).
#
# Uso en el servidor:
#   export API_DOMAIN=api.tu-dominio.com
#   docker compose -p focusia \
#     -f docker-compose.prod.yml -f docker-compose.proxy.yml up -d
#
# Solo luego de que el DNS del dominio apunte a este servidor: Caddy necesita
# resolverse el dominio para emitir el certificado.

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Media y estáticos: Caddy los sirve él mismo (media solo por la ruta
      # interna que autoriza Django; estáticos del admin directamente).
      - media_data:/media:ro
      - static_data:/static:ro
    environment:
      API_DOMAIN: ${API_DOMAIN:?Defina API_DOMAIN en el entorno}
      # IPs (separadas por espacios) que pueden entrar a /admin/. Si no se
      # define, solo localhost: el admin de Django es para el desarrollador.
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-127.0.0.1 ::1}
    depends_on:
      web:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
  media_data:
  static_data:
