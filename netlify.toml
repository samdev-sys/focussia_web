[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_ENV = "production"
# Netlify lee la versión de Node de NODE_VERSION; Node 20 está EOL desde marzo 2026.
NODE_VERSION = "22"
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ IMPORTANTE · VITE_API_URL                                                 │
# │ La URL real del API (ej. https://backend-…up.railway.app) se define SOLO   │
# │ como VARIABLE DE ENTORNO en el panel de Netlify (Site configuration →      │
# │ Environment variables). Vite la hornea en el bundle en build time y cada   │
# │ cambio obliga a un redeploy (Clear cache and deploy).                      │
# │ NO se.define aquí a propósito: un valor en netlify.toml puede pisar el     │
# │ de la UI y dejar el placeholder horneado en producción.                    │
# └───────────────────────────────────────────────────────────────────────────┘

# Panel de administración del frontend (index-admin.html del build).
[[redirects]]
 from = "http://focusia.netlify.app/*"
  to = "https://focusia.netlify.app/:splat"
  status = 301
  force = true

# Rutas del frontend que resuelven al SPA (react-router con BrowserRouter):
# /app/*, /hub, /onboarding, etc. caen acá.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Headers de seguridad
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
/*
  Content-Security-Policy-Report-Only: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /csp-report
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()"

# Headers para assets con hash (cache inmutable)
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, immutable, max-age=31536000"

# Nota: no se agregan Access-Control-* aquí. El front llama directo al dominio
# del API (VITE_API_URL) y el CORS lo maneja Django con corsheaders; los
# cookies de sesión exigen que el backend permita el origen exacto del front
# en CORS_ALLOWED_ORIGINS (con credenciales "*" no funciona).
