[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_ENV = "production"
# Netlify lee la versión de Node de NODE_VERSION; Node 20 está EOL desde marzo 2026.
NODE_VERSION = "22"
# URL del API que se hornea en el bundle en build time (Vite).
# REEMPLAZAR por el dominio real del backend una vez desplegado en el servidor.
VITE_API_URL = "https://api.pendiente-de-definir.com"

# Redirects para manejar las rutas del frontend (SPA)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Headers de seguridad y CORS
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"

# Headers para archivos estáticos (cache)
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, immutable, max-age=31536000"

# Nota: no se agregan Access-Control-* aquí. El front llama directo al dominio
# del API (VITE_API_URL) y el CORS lo maneja Django con corsheaders; los
# cookies de sesión exigen que el backend permita el origen exacto del front
# en CORS_ALLOWED_ORIGINS (con credenciales "*" no funciona).
