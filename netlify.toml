[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_ENV = "production"
# Netlify lee la versión de Node de NODE_VERSION; Node 20 está EOL desde marzo 2026.
NODE_VERSION = "22"

# Redirects para manejar las rutas del frontend (SPA)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Headers de seguridad y CORS
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"

# Headers para archivos estáticos (cache)
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, immutable, max-age=31536000"

# Headers para API calls (CORS)
[[headers]]
for = "/api/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, PATCH"
Access-Control-Allow-Headers = "Content-Type, Authorization"
