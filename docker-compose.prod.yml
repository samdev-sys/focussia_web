services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: focusia_production
      POSTGRES_USER: focusia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el entorno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusia -d focusia_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Sin publicar el puerto: solo el proxy (red interna) habla con gunicorn.
    # Publicarlo dejaba el API accesible en HTTP plano, saltándose TLS y HSTS.
    expose:
      - "8000"
    env_file:
      - backend/.env.production
    environment:
      DATABASE_URL: postgres://focusia:${DB_PASSWORD}@db:5432/focusia_production
      # Sin esto, cualquier variable ausente del env_file caía al .env de
      # desarrollo que viajaba dentro de la imagen.
      DJANGO_SKIP_DOTENV: "1"
    # collectstatic en el arranque: el volumen `static_data` tapa el contenido
    # de la imagen, así que los estáticos se generan aquí (idempotente, ~2 s).
    # Sin esto, Caddy no tendría nada que servir y /admin/ saldría sin CSS.
    command: sh -c "python manage.py collectstatic --noinput && gunicorn focusia_api.wsgi:application --bind 0.0.0.0:8000 --workers 12 --worker-class sync --max-requests 1000 --max-requests-jitter 100"
    volumes:
      # Archivos subidos (sensibles): sobreviven a los despliegues.
      - media_data:/app/media
      # Estáticos del admin, servidos por Caddy desde el mismo volumen.
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.production
    environment:
      DATABASE_URL: postgres://focusia:${DB_PASSWORD}@db:5432/focusia_production
      # Sin esto, cualquier variable ausente del env_file caía al .env de
      # desarrollo que viajaba dentro de la imagen.
      DJANGO_SKIP_DOTENV: "1"
    # Registra los crons al arrancar (idempotente) y luego procesa la cola.
    # Sustituye al antiguo servicio `schedule`, one-shot con restart
    # on-failure: al terminar bien no se reiniciaba, así que tras un reinicio
    # del servidor las tareas quedaban sin registrar y el sistema proactivo
    # se paraba en silencio.
    command: python manage.py start_reminder_worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  backup:
    build:
      context: .
      dockerfile: backend/Dockerfile.backup
    environment:
      DATABASE_URL: postgres://focusia:${DB_PASSWORD}@db:5432/focusia_production
      BACKUP_DIR: /backups
      MEDIA_DIR: /media
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-focussia/backups}
      WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - ./backups:/backups
      - media_data:/media:ro
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  # Contenido subido desde el panel: sensible y persistente.
  media_data:
  # Estáticos del admin; el proxy los lee en solo lectura.
  static_data:
