version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env.staging
    command: gunicorn focusia_api.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      - db
    restart: unless-stopped
    
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
  
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: focusia_staging
      POSTGRES_USER: focusia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el entorno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: