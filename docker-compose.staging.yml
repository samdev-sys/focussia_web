services:
  web:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env.staging
    environment:
      # Ver docker-compose.prod.yml: prohíbe el respaldo silencioso al .env
      # de desarrollo si falta una variable.
      DJANGO_SKIP_DOTENV: "1"
    command: gunicorn focusia_api.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      - db
    restart: unless-stopped

  # Sin worker no hay sistema proactivo: además de procesar la cola, es quien
  # registra los crons al arrancar (ver start_reminder_worker).
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.staging
    environment:
      DJANGO_SKIP_DOTENV: "1"
    command: python manage.py start_reminder_worker
    depends_on:
      - db
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
  
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: focusia_staging
      POSTGRES_USER: focusia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el entorno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: